name: Monthly rainfall report

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: Month to report in YYYY-MM format (defaults to the latest complete month)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    name: Generate monthly rainfall report
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Generate report
        id: report
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        shell: bash
        run: |
          command=(python scripts/monthly_report.py)
          if [[ -n "$REQUESTED_MONTH" ]]; then
            command+=(--month "$REQUESTED_MONTH")
          fi

          output="$("${command[@]}")"
          printf '%s\n' "$output"
          report_path="$(printf '%s\n' "$output" | sed -n 's/^Wrote //p' | tail -n 1)"
          report_month="$(basename "$report_path" .md)"

          test -f "reports/$report_month.md"
          echo "month=$report_month" >> "$GITHUB_OUTPUT"
          echo "path=reports/$report_month.md" >> "$GITHUB_OUTPUT"

      - name: Check whether the report changed
        id: changes
        env:
          REPORT_PATH: ${{ steps.report.outputs.path }}
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- "$REPORT_PATH")" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The report is unchanged; no pull request is needed."
          fi

      - name: Commit report and open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_MONTH: ${{ steps.report.outputs.month }}
          REPORT_PATH: ${{ steps.report.outputs.path }}
        shell: bash
        run: |
          branch_name="report/$REPORT_MONTH"
          title="Monthly rainfall report $REPORT_MONTH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch_name"
          git add "$REPORT_PATH"
          git commit -m "$title"
          git push --force-with-lease --set-upstream origin "$branch_name"

          existing_pr="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$branch_name" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$branch_name" \
              --title "$title" \
              --body "Generated by the monthly rainfall report workflow."
          else
            echo "Updated existing pull request #$existing_pr."
          fi